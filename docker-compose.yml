services:
  gateway:
    build: ./gateway
    container_name: gateway
    restart: unless-stopped
    ports:
      - "8081:8080"
    env_file:
      - ./gateway/.env
    depends_on:
      auth-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:8080/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  auth-service:
    build: ./auth-service
    container_name: auth-service
    restart: unless-stopped
    env_file:
      - ./auth-service/.env
    environment:
      DATABASE_URL: "postgresql://${DB_USER:?Set DB_USER in root .env}:${DB_PASSWORD:?Set DB_PASSWORD in root .env}@auth-postgres:5432/auth_db?schema=public"
    depends_on:
      auth-postgres:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:4001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  auth-postgres:
    image: postgres:16-alpine
    container_name: auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER in root .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in root .env}
      POSTGRES_DB: auth_db
    volumes:
      - auth-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  catalog-service:
    build: ./catalog-service
    container_name: catalog-service
    restart: unless-stopped
    env_file:
      - ./catalog-service/.env
    environment:
      MONGO_URI: mongodb://catalog-mongo:27017/catalog_db
    depends_on:
      catalog-mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:4002/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  catalog-mongo:
    image: mongo:7
    container_name: catalog-mongo
    restart: unless-stopped
    volumes:
      - catalog-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  cart-service:
    build: ./cart-service
    container_name: cart-service
    restart: unless-stopped
    env_file:
      - ./cart-service/.env
    environment:
      REDIS_URL: redis://cart-redis:6379
      CATALOG_SERVICE_URL: http://catalog-service:4002
    depends_on:
      cart-redis:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:4003/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  cart-redis:
    image: redis:7-alpine
    container_name: cart-redis
    restart: unless-stopped
    volumes:
      - cart-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  inventory-service:
    build: ./inventory-service
    container_name: inventory-service
    restart: unless-stopped
    env_file:
      - ./inventory-service/.env
    environment:
      DATABASE_URL: "postgresql://${DB_USER:?Set DB_USER in root .env}:${DB_PASSWORD:?Set DB_PASSWORD in root .env}@inventory-postgres:5432/inventory_db?schema=public"
    depends_on:
      inventory-postgres:
        condition: service_healthy
      inventory-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:4004/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  inventory-postgres:
    image: postgres:16-alpine
    container_name: inventory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER in root .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in root .env}
      POSTGRES_DB: inventory_db
    volumes:
      - inventory-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  order-service:
    build: ./order-service
    container_name: order-service
    restart: unless-stopped
    env_file:
      - ./order-service/.env
    environment:
      DATABASE_URL: "postgresql://${DB_USER:?Set DB_USER in root .env}:${DB_PASSWORD:?Set DB_PASSWORD in root .env}@order-postgres:5432/order_db?schema=public"
      INVENTORY_SERVICE_URL: http://inventory-service:4004
      CATALOG_SERVICE_URL: http://catalog-service:4002
      REDIS_URL: redis://event-redis:6379
    depends_on:
      order-postgres:
        condition: service_healthy
      order-migrate:
        condition: service_completed_successfully
      inventory-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      event-redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:4005/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  order-postgres:
    image: postgres:16-alpine
    container_name: order-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER in root .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in root .env}
      POSTGRES_DB: order_db
    volumes:
      - order-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  payment-service:
    build: ./payment-service
    container_name: payment-service
    restart: unless-stopped
    env_file:
      - ./payment-service/.env
    environment:
      DATABASE_URL: "postgresql://${DB_USER:?Set DB_USER in root .env}:${DB_PASSWORD:?Set DB_PASSWORD in root .env}@payment-postgres:5432/payment_db?schema=public"
      ORDER_SERVICE_URL: http://order-service:4005
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    depends_on:
      payment-postgres:
        condition: service_healthy
      payment-migrate:
        condition: service_completed_successfully
      order-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:4006/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  payment-postgres:
    image: postgres:16-alpine
    container_name: payment-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER in root .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in root .env}
      POSTGRES_DB: payment_db
    volumes:
      - payment-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  event-redis:
    image: redis:7-alpine
    container_name: event-redis
    restart: unless-stopped
    volumes:
      - event-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  notification-service:
    build: ./notification-service
    container_name: notification-service
    restart: unless-stopped
    env_file:
      - ./notification-service/.env
    environment:
      DATABASE_URL: "postgresql://${DB_USER:?Set DB_USER in root .env}:${DB_PASSWORD:?Set DB_PASSWORD in root .env}@notification-postgres:5432/notification_db?schema=public"
      REDIS_URL: redis://event-redis:6379
      EVENT_STREAM: order-events
      CONSUMER_GROUP: notification-group
      CONSUMER_NAME: notification-worker-1
      RETRY_STREAM: order-events-retry
      FAILED_STREAM: order-events-failed
      MAX_RETRIES: "3"
    depends_on:
      notification-postgres:
        condition: service_healthy
      notification-migrate:
        condition: service_completed_successfully
      event-redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:4007/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  notification-postgres:
    image: postgres:16-alpine
    container_name: notification-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER in root .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in root .env}
      POSTGRES_DB: notification_db
    volumes:
      - notification-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- Database migrations ----------
  # One-shot jobs: each applies its service's Prisma migrations to its own
  # Postgres, then exits. The matching service waits for it to finish
  # successfully (service_completed_successfully). Re-running is safe:
  # `prisma migrate deploy` only applies migrations that are still pending.
  auth-migrate:
    build:
      context: ./auth-service
      target: migrate
    restart: "no"
    environment:
      DATABASE_URL: "postgresql://${DB_USER:?Set DB_USER in root .env}:${DB_PASSWORD:?Set DB_PASSWORD in root .env}@auth-postgres:5432/auth_db?schema=public"
    depends_on:
      auth-postgres:
        condition: service_healthy

  inventory-migrate:
    build:
      context: ./inventory-service
      target: migrate
    restart: "no"
    environment:
      DATABASE_URL: "postgresql://${DB_USER:?Set DB_USER in root .env}:${DB_PASSWORD:?Set DB_PASSWORD in root .env}@inventory-postgres:5432/inventory_db?schema=public"
    depends_on:
      inventory-postgres:
        condition: service_healthy

  order-migrate:
    build:
      context: ./order-service
      target: migrate
    restart: "no"
    environment:
      DATABASE_URL: "postgresql://${DB_USER:?Set DB_USER in root .env}:${DB_PASSWORD:?Set DB_PASSWORD in root .env}@order-postgres:5432/order_db?schema=public"
    depends_on:
      order-postgres:
        condition: service_healthy

  payment-migrate:
    build:
      context: ./payment-service
      target: migrate
    restart: "no"
    environment:
      DATABASE_URL: "postgresql://${DB_USER:?Set DB_USER in root .env}:${DB_PASSWORD:?Set DB_PASSWORD in root .env}@payment-postgres:5432/payment_db?schema=public"
    depends_on:
      payment-postgres:
        condition: service_healthy

  notification-migrate:
    build:
      context: ./notification-service
      target: migrate
    restart: "no"
    environment:
      DATABASE_URL: "postgresql://${DB_USER:?Set DB_USER in root .env}:${DB_PASSWORD:?Set DB_PASSWORD in root .env}@notification-postgres:5432/notification_db?schema=public"
    depends_on:
      notification-postgres:
        condition: service_healthy

volumes:
  auth-pg-data:
  catalog-mongo-data:
  cart-redis-data:
  inventory-pg-data:
  order-pg-data:
  payment-pg-data:
  event-redis-data:
  notification-pg-data: